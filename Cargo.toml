[package]
name = "kame"
version = "0.1.0"
edition = "2024"
description = "An SSH toolkit for your terminal"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ErikKarlgren/kame"
keywords = ["ssh", "cli", "ssh-config", "terminal"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["wrap_help"] }
dirs = "6.0.0"
terminal_size = "0.4.4"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread"] }
